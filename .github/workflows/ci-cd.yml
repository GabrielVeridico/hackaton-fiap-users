name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  ci:
    name: Build, Test & Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore HackatonFiap.Users.sln

      - name: Build
        run: dotnet build HackatonFiap.Users.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HackatonFiap.Users.sln --configuration Release --no-build --verbosity normal

      # RT5: a geração da imagem Docker é obrigatória a cada push na branch principal.
      # Roda SEMPRE (não depende de credenciais de registry); o push/deploy é opcional (job cd).
      - name: Build Docker image
        run: docker build -t hackatonfiap-users:${{ github.sha }} -f src/HackatonFiap.Users.API/Dockerfile .

  cd:
    name: Deploy to AKS (opcional)
    runs-on: ubuntu-latest
    needs: ci
    # Roda em push na main ou em disparo manual, e só com a variável DEPLOY_TO_AKS=true.
    # Assim a esteira obrigatória (build + testes + imagem) permanece verde mesmo sem infra Azure provisionada.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_TO_AKS == 'true'
    permissions:
      id-token: write        # obrigatório para o OIDC do azure/login
      security-events: write # upload do SARIF do Trivy
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Autenticação federada (OIDC): nenhuma senha de longa duração fica guardada no repositório.
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # az acr login reaproveita o token do OIDC — dispensa ACR_USERNAME/ACR_PASSWORD.
      - name: Login no ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build da imagem
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/hackatonfiap-users
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest -f src/HackatonFiap.Users.API/Dockerfile .

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_NAME }}.azurecr.io/hackatonfiap-users:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push da imagem
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/hackatonfiap-users
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Credenciais do AKS
        run: az aks get-credentials -g ${{ secrets.RESOURCE_GROUP }} -n ${{ secrets.AKS_CLUSTER_NAME }} --overwrite-existing

      # O Deployment é criado pelo Helm (hackaton-fiap-orchestration/iac/deploy-apps.ps1); aqui só
      # rolamos a nova imagem. NÃO usar `kubectl apply` de manifesto cru: o selector do Deployment
      # gerenciado pelo Helm (app.kubernetes.io/name) é imutável e o apply falha.
      # Os manifestos plain-YAML de referência (RT3) ficam em hackaton-fiap-orchestration/k8s/.
      - name: Rolling deploy
        run: |
          kubectl set image deployment/hackatonfiap-users \
            hackatonfiap-users=${{ secrets.ACR_NAME }}.azurecr.io/hackatonfiap-users:${{ github.sha }} \
            -n conexao-solidaria
          kubectl rollout status deployment/hackatonfiap-users -n conexao-solidaria --timeout=180s
